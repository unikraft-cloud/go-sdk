# https://taskfile.dev
version: 3

includes:
  go:
    taskfile: https://github.com/unikraft-cloud/x.git//Taskfile.go.yml?ref=prod-staging

vars:
  go_bin:
    ref: .go_bin | default "go"
  curl_bin:
    ref: .curl_bin | default "curl"

  svu_version: v3.4.1
  svu_bin: "{{.go_bin}} run github.com/caarlos0/svu/v3@{{.svu_version}}"

  task_version: v3.48.0
  task_bin:
    sh: command -v task >/dev/null 2>&1 && echo "task --yes" || echo "{{.go_bin}} run github.com/go-task/task/v3/cmd/task@{{.task_version}} --yes"

  channel:
    ref: .channel | default (default "prod-stable" .CHANNEL)

tasks:
  default:
    cmds:
    - task: generate

  generate:
    desc: Generate the SDK from the OpenAPI specifications.
    cmds:
    - task: generate:spec
      vars: { spec: platform }
    - task: generate:spec
      vars: { spec: controlplane }
    - task: fmt

  generate:spec:
    internal: true
    requires:
      vars: [spec]
    cmds:
    - test -f {{.spec}}.yaml || {{.curl_bin}} -f -o {{.spec}}.yaml https://raw.githubusercontent.com/unikraft-cloud/openapi/{{.channel}}/{{.spec}}.yaml
    - rm -f ./{{.spec}}/*.gen.go
    - task: go:generate
      vars: { package: "./{{.spec}}" }

  fmt:
    desc: Format the project.
    cmd: >-
      {{.go_bin}} fmt ./...

  lint:
    desc: Lint the project.
    cmds:
    - task: go:lint

  license:
    desc: Check the project licensing.
    cmds:
    - task: go:license

  test:
    aliases: [unit]
    desc: Run unit tests.
    cmds:
    - task: go:test

  clean:
    desc: Remove build artifacts.
    cmds:
    - rm -rf dist

  last-version:
    desc: Show the last version of the SDK.
    silent: true
    cmds:
    - |
      {{.svu_bin}} current

  next-stable:
    desc: Show the next stable version of the SDK.
    silent: true
    cmds:
    - |
      PRERELEASE="${PRERELEASE:-}"
      {{.svu_bin}} next --always --v0 --tag.prefix "v" --tag.pattern "v[0-9]*.[0-9]*.[0-9]*" --prerelease "$PRERELEASE"

  next-staging:
    desc: Show the next staging version of the SDK.
    silent: true
    cmds:
    - |
      NEXT=$({{.svu_bin}} current)
      if [[ "$NEXT" == *"staging"* ]]; then
        NEXT=$(echo "$NEXT" | awk -F. '{print $1 "." $2 "." $3 "." $4 + 1}')
      else
        NEXT=$(PRERELEASE=staging.1 {{.task_bin}} next-stable)
      fi
      echo $NEXT

  # ci tasks

  ci/check:
  - task: go:ci/check

  ci/test:
  - task: go:ci/test

  ci/generate:
    desc: "Tasks for CI generate job: check the SDK is in sync with the specifications"
    cmds:
    - task: generate
    - git diff --exit-code
