version: 2

updates:
# Dependabot does not support Go workspaces, so it visits each module on its
# own. See [0].
# [0]: https://github.com/dependabot/dependabot-core/issues/6012
- package-ecosystem: gomod
  directories:
  - /
  - /plugins/sandbox
  target-branch: prod-staging
  schedule:
    interval: weekly
    day: sunday
    time: '09:00'
  commit-message:
    prefix: gomod # Prefix messages with
    include: scope # List all updated dependencies
  ignore:
    # The plugin resolves the SDK through the workspace, so the tree is the
    # source of truth for its pseudo-version.
    - dependency-name: unikraft.com/cloud/sdk
  groups:
    go-deps:
      applies-to: version-updates
      patterns:
      - '*'

- package-ecosystem: github-actions
  directory: /
  target-branch: prod-staging
  schedule:
    interval: weekly
    day: sunday
    time: '09:00'
  groups:
    github-deps:
      applies-to: version-updates
      patterns:
      - '*'
