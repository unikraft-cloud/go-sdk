name: promote

on:
  push:
    branches: [prod-staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    uses: unikraft-cloud/x/.github/workflows/promote.yaml@prod-staging
    with:
      gh_client_id: ${{ vars.TOOLING_APP_CLIENT_ID }}
    secrets:
      gh_private_key: ${{ secrets.TOOLING_APP_PRIVATE_KEY }}
