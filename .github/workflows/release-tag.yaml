name: release-tag

on:
  push:
    branches:
    - prod-staging
    - prod-stable

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  GOPRIVATE: github.com/unikraft-cloud/x

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
    - name: Mint a token of the GitHub App
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.TOOLING_APP_CLIENT_ID }}
        private-key: ${{ secrets.TOOLING_APP_PRIVATE_KEY }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write

    # Private modules live in other repositories, so this isn't scoped to this one.
    - name: Mint a token of the GitHub App for private modules
      id: modules-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.TOOLING_APP_CLIENT_ID }}
        private-key: ${{ secrets.TOOLING_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        permission-contents: read

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}

    - name: Fetch all tags
      shell: bash
      run: git fetch --force --tags

    - name: Login to GitHub
      shell: bash
      env:
        TOKEN: ${{ steps.modules-token.outputs.token }}
      run: |
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        git config user.name "Unikraft Bot"
        git config user.email "monkey@unikraft.com"

    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.work

    - name: Tag next version
      shell: bash
      run: |
        # Without --trusted-hosts, task prints its trust prompt to stdout on a fresh checkout.
        if [[ "${{ github.ref }}" == "refs/heads/prod-stable" ]]; then
          VERSION=$(task --yes --trusted-hosts github.com next-stable)
        else
          VERSION=$(task --yes --trusted-hosts github.com next-staging)
        fi

        if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-staging\.[0-9]+)?$ ]]; then
          echo "Unexpected version: ${VERSION}" >&2
          exit 1
        fi

        # Nested modules need their own <dir>/<version> tag, or Go sees no versions for them.
        TAGS=()
        for dir in $(go work edit -json | jq -r '.Use[].DiskPath'); do
          dir="${dir#./}"
          if [[ "${dir}" == "." ]]; then
            TAG="${VERSION}"
          else
            TAG="${dir}/${VERSION}"
          fi
          git tag -a "${TAG}" -m "${TAG}"
          TAGS+=("${TAG}")
        done
        git push --atomic origin "${TAGS[@]}"
