name: sync

on:
  workflow_dispatch:
    inputs:
      channel:
        default: prod-stable
        description: |
          The name of the release channel.
          One of: [prod-stable, prod-staging]

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Mint a token of the GitHub App
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.TOOLING_APP_CLIENT_ID }}
        private-key: ${{ secrets.TOOLING_APP_PRIVATE_KEY }}
        repositories: ${{ github.event.repository.name }}
        permission-contents: write
        permission-pull-requests: write

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.channel }}

    - name: Generate
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
      run: |
        make generate
        make fmt

    - name: Show diff
      shell: bash
      run: |
        git diff

    - name: Create pull request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
      with:
        token: ${{ steps.app-token.outputs.token }}
        base: ${{ inputs.channel }}
        commit-message: "chore: Update Go SDK from OpenAPI spec"
        title: "chore: Update Go SDK from OpenAPI spec"
        branch: sync/${{ inputs.channel }}
        committer: Unikraft Bot <monkey@unikraft.io>
        author: Unikraft Bot <monkey@unikraft.io>
        add-paths: controlplane,platform,build
        signoff: true
